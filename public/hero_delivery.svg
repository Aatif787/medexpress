<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Simple Background Circle -->
  <circle cx="400" cy="300" r="250" fill="#eff6ff" />
  
  <!-- Content Group -->
  <g transform="translate(400, 300)">
    <!-- Phone -->
    <rect x="-60" y="-100" width="120" height="200" rx="15" fill="#1e293b" stroke="#334155" stroke-width="4" />
    <rect x="-50" y="-90" width="100" height="180" rx="10" fill="#dbeafe" />
    
    <!-- Bag -->
    <rect x="80" y="20" width="100" height="120" rx="4" fill="#ea580c" transform="rotate(10)" />
    <path d="M110 20 Q 130 -20 150 20" stroke="#ea580c" stroke-width="6" fill="none" transform="rotate(10)" />
    
    <!-- Floating Icon -->
     <circle cx="-120" cy="-50" r="30" fill="#10b981" />
     <path d="M-130 -50 L-120 -40 L-110 -60" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
